<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sky – Flugzeuge über mir</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef4f8}.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;pointer-events:none}.pill{pointer-events:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:0;border-radius:16px;padding:10px 13px;box-shadow:0 4px 18px #0002;font-weight:650}.brand{margin-right:auto}.status{font-size:13px;font-weight:500;color:#53616b}.plane{font-size:25px;line-height:25px;filter:drop-shadow(0 1px 2px #fff)}.leaflet-div-icon{background:none;border:0}.leaflet-popup-content{margin:14px 16px;min-width:220px}.flight{font-size:20px;font-weight:750}.route{font-size:18px;font-weight:700;margin:7px 0}.muted{color:#687780;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;font-size:14px}.bottom{position:fixed;z-index:1000;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px}.bottom button{border:0;border-radius:22px;padding:12px 16px;background:#fff;box-shadow:0 4px 18px #0002;font-weight:700}
</style></head><body><div id="map"></div><div class="top"><div class="pill brand">SKY <span class="status" id="status">Standort wird gesucht…</span></div></div><div class="bottom"><button id="locate">◎ Mein Standort</button><button id="refresh">↻ Aktualisieren</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([46.8,8.2],7); L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
let user=null,userMarker=null,planes=L.layerGroup().addTo(map),timer=null; const status=document.getElementById('status');
const clean=s=>(s||'').trim(); const n=v=>Number.isFinite(+v)?+v:null; const feetToM=v=>Math.round(v*0.3048); const knotsToKmh=v=>Math.round(v*1.852);
function icon(track){return L.divIcon({className:'',html:`<div class="plane" style="transform:rotate(${n(track)||0}deg)">✈</div>`,iconSize:[28,28],iconAnchor:[14,14]})}
async function enrich(hex,callsign){try{let u=`https://api.adsbdb.com/v0/aircraft/${encodeURIComponent(hex)}`; if(callsign)u+=`?callsign=${encodeURIComponent(callsign)}`;let r=await fetch(u);if(!r.ok)return {};return (await r.json()).response||{}}catch{return {}}}
function airport(a){if(!a)return null; return a.iata_code||a.icao_code||a.municipality||null}
async function details(a,marker){let cs=clean(a.flight); marker.bindPopup('<b>Daten werden geladen…</b>').openPopup(); const e=await enrich(a.hex,cs); const ac=e.aircraft||{},fr=e.flightroute||{}; const from=airport(fr.origin),to=airport(fr.destination); const route=from&&to?`${from} → ${to}`:'Route nicht verfügbar'; const alt=n(a.alt_geom??a.alt_baro), speed=n(a.gs); marker.setPopupContent(`<div class="flight">${fr.callsign_iata||cs||ac.registration||'Unbekannter Flug'}</div><div class="route">${route}</div><div class="muted">${fr.airline?.name||ac.registered_owner||''}</div><div class="grid"><span>Typ</span><b>${ac.type||ac.icao_type||a.t||'–'}</b><span>Registration</span><b>${ac.registration||a.r||'–'}</b><span>Höhe</span><b>${alt!==null?(typeof alt==='number'?feetToM(alt).toLocaleString('de-CH')+' m':'–'):'–'}</b><span>Tempo</span><b>${speed!==null?knotsToKmh(speed)+' km/h':'–'}</b></div>`)}
async function load(){if(!user)return; status.textContent='Flugzeuge werden geladen…'; try{const [lat,lon]=user; const r=await fetch(`https://opendata.adsb.fi/api/v3/lat/${lat}/lon/${lon}/dist/50`); if(!r.ok)throw Error(r.status); const d=await r.json(); const list=d.ac||d.aircraft||[]; planes.clearLayers(); let shown=0; for(const a of list){if(n(a.lat)===null||n(a.lon)===null)continue; const m=L.marker([a.lat,a.lon],{icon:icon(a.track)}).addTo(planes); m.on('click',()=>details(a,m)); shown++;} status.textContent=`${shown} Flugzeuge · 50 NM`; }catch(e){status.textContent='Live-Daten momentan nicht erreichbar'; console.error(e)}}
function locate(){
  status.textContent='Standort wird gesucht…';
  if(!window.isSecureContext){
    status.textContent='Keine sichere HTTPS-Verbindung';
    alert('Sky wurde nicht über eine sichere HTTPS-Verbindung geöffnet. Bitte die GitHub-Pages-Adresse direkt in Safari öffnen.');
    return;
  }
  if(!('geolocation' in navigator)){
    status.textContent='Geolocation nicht verfügbar';
    alert('Safari stellt Sky derzeit keinen Standortdienst zur Verfügung.');
    return;
  }
  navigator.geolocation.getCurrentPosition(p=>{
    user=[p.coords.latitude,p.coords.longitude];
    if(userMarker)map.removeLayer(userMarker);
    userMarker=L.circleMarker(user,{radius:7,weight:3,fillOpacity:1}).addTo(map).bindTooltip('Du bist hier');
    map.setView(user,9); load(); clearInterval(timer); timer=setInterval(load,15000)
  },e=>{
    const msg = e.code===1 ? 'Standortzugriff wurde von iOS/Safari verweigert.' : e.code===2 ? 'iPhone konnte den Standort momentan nicht bestimmen.' : e.code===3 ? 'Standortbestimmung hat zu lange gedauert.' : 'Unbekannter Standortfehler.';
    status.textContent=msg;
    alert(msg+'\n\nFehlercode: '+e.code+(e.message?'\n'+e.message:''));
    console.error('Geolocation error',e);
  },{enableHighAccuracy:false,timeout:30000,maximumAge:60000})
}
document.getElementById('locate').onclick=locate; document.getElementById('refresh').onclick=load; locate();
</script></body></html>
