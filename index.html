<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky V0.1.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#status{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:rgba(255,255,255,.94);padding:10px 12px;border-radius:12px;box-shadow:0 2px 12px #0002;font-size:14px}
.plane{font-size:25px;line-height:25px;text-shadow:0 1px 2px white}
.leaflet-popup-content{min-width:210px}
.small{color:#666;font-size:12px}
</style>
</head>
<body>
<div id="status">Standort wird bestimmt …</div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RADIUS_NM=100, REFRESH_MS=15000;
const statusEl=document.getElementById("status");
const map=L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
let me, layer=L.layerGroup().addTo(map), pos;

function status(s){statusEl.textContent=s}
function n(v,d=0){const x=Number(v);return Number.isFinite(x)?x.toFixed(d):"–"}
function ftm(ft){return Number.isFinite(Number(ft))?Math.round(Number(ft)*0.3048):null}
function ktkmh(kt){return Number.isFinite(Number(kt))?Math.round(Number(kt)*1.852):null}

async function routeInfo(callsign){
  if(!callsign) return null;
  try{
    const r=await fetch("https://api.adsbdb.com/v0/callsign/"+encodeURIComponent(callsign.trim()));
    if(!r.ok)return null;
    const j=await r.json();
    return j?.response?.flightroute||null;
  }catch(e){return null}
}

function planeIcon(track){
  return L.divIcon({className:"",html:`<div class="plane" style="transform:rotate(${Number(track)||0}deg)">✈</div>`,iconSize:[28,28],iconAnchor:[14,14]});
}

async function loadAircraft(){
  if(!pos)return;
  const {latitude:lat,longitude:lon}=pos.coords;
  const url=`https://opendata.adsb.fi/api/v3/lat/${lat}/lon/${lon}/dist/${RADIUS_NM}`;
  status("Flugzeuge werden geladen …");
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok) throw new Error(`ADS-B API: HTTP ${r.status}`);
    const j=await r.json();
    const ac=Array.isArray(j.ac)?j.ac:[];
    layer.clearLayers();
    let shown=0;
    for(const a of ac){
      if(!Number.isFinite(Number(a.lat))||!Number.isFinite(Number(a.lon))) continue;
      shown++;
      const callsign=(a.flight||a.callsign||"").trim();
      const altFt=a.alt_baro==="ground"?0:Number(a.alt_baro ?? a.alt_geom);
      const speed=Number(a.gs);
      const reg=a.r||a.reg||"";
      const type=a.t||a.type||"";
      const marker=L.marker([Number(a.lat),Number(a.lon)],{icon:planeIcon(a.track)}).addTo(layer);
      marker.bindPopup(`<b>${callsign||reg||a.hex||"Flugzeug"}</b><br>
        ${reg?`Registrierung: ${reg}<br>`:""}${type?`Typ: ${type}<br>`:""}
        Höhe: ${altFt===0?"Boden":(ftm(altFt)!=null?n(ftm(altFt)).replace(/\B(?=(\d{3})+(?!\d))/g,"'")+" m":"–")}<br>
        Geschwindigkeit: ${ktkmh(speed)!=null?ktkmh(speed)+" km/h":"–"}<br>
        <span class="small">Antippen für Route …</span>`);
      marker.on("popupopen",async()=>{
        if(!callsign)return;
        const route=await routeInfo(callsign);
        if(!route)return;
        const o=route.origin?.iata_code||route.origin?.icao_code;
        const d=route.destination?.iata_code||route.destination?.icao_code;
        if(o||d){
          marker.setPopupContent(`<b>${callsign}</b><br><b>${o||"?"} → ${d||"?"}</b><br>
          ${reg?`Registrierung: ${reg}<br>`:""}${type?`Typ: ${type}<br>`:""}
          Höhe: ${altFt===0?"Boden":(ftm(altFt)!=null:n(ftm(altFt)).replace(/\B(?=(\d{3})+(?!\d))/g,"'")+" m":"–")}<br>
          Geschwindigkeit: ${ktkmh(speed)!=null?ktkmh(speed)+" km/h":"–"}`);
        }
      });
    }
    status(`🟢 ${shown} Flugzeuge im Umkreis von ${RADIUS_NM} NM · ${new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`);
  }catch(e){
    console.error(e);
    status("🔴 Flugzeugdaten konnten nicht geladen werden · "+e.message);
  }
}

function geoError(e){
  const names={1:"Standort wurde von iOS/Safari verweigert",2:"Standort ist momentan nicht verfügbar",3:"Standortabfrage hat zu lange gedauert"};
  status(`🔴 ${names[e.code]||e.message} · Fehlercode ${e.code}`);
}

if(!window.isSecureContext) status("🔴 Diese Seite muss über HTTPS geöffnet werden.");
else if(!navigator.geolocation) status("🔴 Dieser Browser unterstützt keine Standortbestimmung.");
else navigator.geolocation.getCurrentPosition(p=>{
  pos=p;
  const ll=[p.coords.latitude,p.coords.longitude];
  map.setView(ll,8);
  me=L.circleMarker(ll,{radius:8,weight:3,fillOpacity:.8}).addTo(map).bindPopup("Dein Standort");
  L.circle(ll,{radius:RADIUS_NM*1852,weight:1,fillOpacity:.03}).addTo(map);
  loadAircraft();
  setInterval(loadAircraft,REFRESH_MS);
},geoError,{enableHighAccuracy:true,timeout:20000,maximumAge:30000});
</script>
</body>
</html>
