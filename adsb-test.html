<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky – ADSB.lol Verbindungstest</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:28px;background:#f5f5f7;color:#111}
.card{max-width:620px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 3px 20px #0001}
#result{font-size:24px;font-weight:700;margin:22px 0}
small{color:#666} code{word-break:break-all}
</style>
</head>
<body><div class="card">
<h1>Sky Verbindungstest</h1>
<p>Dieser Test fragt ADSB.lol direkt aus Safari ab. Dein Standort wird dafür nicht benötigt.</p>
<div id="result">⏳ Test läuft …</div>
<div id="detail"></div>
</div>
<script>
(async()=>{
 const result=document.getElementById("result"), detail=document.getElementById("detail");
 // Fixed European test point (central Switzerland), deliberately no device geolocation.
 const url="https://api.adsb.lol/v2/lat/46.95/lon/7.45/dist/100";
 try{
   const r=await fetch(url,{cache:"no-store"});
   if(!r.ok) throw new Error("HTTP "+r.status);
   const j=await r.json();
   const count=Array.isArray(j.ac)?j.ac.length:"?";
   result.textContent="✅ Browserzugriff funktioniert";
   detail.innerHTML="<p>Antwort der Live-API erhalten. Flugzeuge im Testgebiet: <b>"+count+"</b>.</p><small>Damit können wir Sky ohne zusätzlichen Proxy/Account weiterbauen.</small>";
 }catch(e){
   result.textContent="❌ Browserzugriff blockiert";
   detail.innerHTML="<p><b>"+String(e.message)+"</b></p><small>Wenn Safari „Load failed“ oder „Failed to fetch“ meldet, ist sehr wahrscheinlich der direkte Cross-Origin-Zugriff blockiert.</small>";
 }
})();
</script></body></html>
